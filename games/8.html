<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>极简便签</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        ::-webkit-scrollbar { width: 0; height: 0; }

        .back-btn {
            position: fixed; top: 15px; left: 15px; z-index: 9999;
            color: #fff; background: rgba(50, 50, 50, 0.8);
            padding: 8px 15px; border-radius: 20px; text-decoration: none; font-size: 14px;
        }

        /* 顶部工具栏 */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 40px;
            margin-bottom: 15px;
            font-size: 13px;
            color: #888;
        }
        .status-text { color: #4caf50; transition: opacity 0.3s; opacity: 0; }
        .status-text.show { opacity: 1; }

        .clear-btn {
            background-color: #1e1e1e;
            color: #ff4757;
            border: 1px solid #333;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 12px;
        }
        .clear-btn:active { background-color: #333; }

        /* 输入框区域 */
        textarea {
            flex: 1;
            width: 100%;
            background-color: #1e1e1e;
            color: #ffffff;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            font-size: 16px;
            line-height: 1.6;
            resize: none;
            outline: none;
            box-sizing: border-box;
            font-family: sans-serif;
        }
        textarea:focus { border-color: #555; }
        
        /* 底部字数统计 */
        .footer {
            text-align: right;
            font-size: 12px;
            color: #555;
            margin-top: 10px;
            height: 16px;
        }
    </style>
</head>
<body>
    <a href="../index.html" class="back-btn">← 返回</a>

    <div class="toolbar">
        <div class="status-text" id="statusText">✓ 已自动保存</div>
        <button class="clear-btn" onclick="clearNote()">清空便签</button>
    </div>
    
    <textarea id="noteArea" placeholder="在这里输入内容，断网也能用，关掉再打开还在..."></textarea>
    
    <div class="footer">
        字数: <span id="charCount">0</span>
    </div>

    <script>
        var noteArea = document.getElementById('noteArea');
        var statusText = document.getElementById('statusText');
        var charCount = document.getElementById('charCount');
        var saveTimeout = null;

        // 1. 页面加载时，读取本地保存的内容
        var savedText = localStorage.getItem('my_quick_note');
        if (savedText) {
            noteArea.value = savedText;
            charCount.innerText = savedText.length;
        }

        // 2. 监听输入，实时保存（带防抖机制，打字太快不会卡）
        noteArea.addEventListener('input', function() {
            var currentText = noteArea.value;
            charCount.innerText = currentText.length;

            // 每敲一下键盘，都把内容存进本地
            localStorage.setItem('my_quick_note', currentText);

            // 显示“已保存”提示
            statusText.classList.add('show');
            
            // 如果之前有定时器，先清掉
            if (saveTimeout) clearTimeout(saveTimeout);
            
            // 1秒后隐藏提示
            saveTimeout = setTimeout(function() {
                statusText.classList.remove('show');
            }, 1000);
        });

        // 3. 清空便签功能
        function clearNote() {
            if (noteArea.value === '') return;
            
            // 原生确认弹窗，防手滑
            var confirmClear = confirm("确定要清空便签吗？清空后无法恢复哦！");
            if (confirmClear) {
                noteArea.value = '';
                charCount.innerText = '0';
                localStorage.removeItem('my_quick_note');
                statusText.classList.remove('show');
            }
        }
    </script>
</body>
</html>
