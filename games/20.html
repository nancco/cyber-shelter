<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>国产 AI 盲盒</title>
    <style>
        body {
            background-color: #121212; color: #ffffff; font-family: sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; margin: 0; overflow: hidden; user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .back-btn {
            position: fixed; top: 15px; left: 15px; z-index: 9999;
            color: #fff; background: rgba(50, 50, 50, 0.8);
            padding: 8px 15px; border-radius: 20px; text-decoration: none; font-size: 14px;
        }

        .header { text-align: center; margin-bottom: 50px; }
        .header h1 { font-size: 28px; color: #00d2ff; margin-bottom: 10px; letter-spacing: 2px;}
        .header p { font-size: 14px; color: #888; }

        /* 核心召唤按钮 */
        .summon-btn {
            width: 180px; height: 180px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1e1e1e, #333);
            border: 4px solid #00d2ff;
            box-shadow: 0 0 40px rgba(0, 210, 255, 0.2), inset 0 0 20px rgba(0, 210, 255, 0.2);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .summon-btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 60px rgba(0, 210, 255, 0.5);
            background: #1e1e1e;
        }
        
        .summon-btn h2 { font-size: 24px; margin: 0; color: #fff; font-weight: bold;}
        .summon-btn span { font-size: 12px; color: #00d2ff; margin-top: 5px;}

        .dice { font-size: 40px; margin-bottom: 10px; }

        /* 加载遮罩 */
        #loading {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #121212; z-index: 99999;
            display: none; flex-direction: column; align-items: center; justify-content: center;
        }
        #loading h1 { color: #00d2ff; font-size: 24px; animation: pulse 1s infinite;}
        #loading p { color: #888; font-size: 14px; margin-top: 10px;}
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>
    <a href="../index.html" class="back-btn">← 返回</a>

    <div class="header">
        <h1>国产 AI 盲盒</h1>
        <p>点击召唤，随机传送到一个国产赛博大脑</p>
    </div>

    <div class="summon-btn" onclick="summonAI()">
        <div class="dice">🎲</div>
        <h2>随机召唤</h2>
        <span>点我掷骰子</span>
    </div>

    <div id="loading">
        <h1>正在匹配...</h1>
        <p>请稍候</p>
    </div>

    <script>
        window.onerror = function(msg) {
            alert("发生错误: " + msg);
            return false;
        };

        var isLoading = false;

        // 纯正国产大模型盲盒池（全部直达聊天界面）
               var aiSites = [
                   { name: "DeepSeek", url: "https://www.deepseek.com/" }, // 直达对话
                   { name: "Kimi", url: "https://kimi.moonshot.cn/chat/" }, // 直达对话
                   { name: "通义千问", url: "https://tongyi.aliyun.com/qianwen/" },
                   { name: "文心一言", url: "https://yiyan.baidu.com/" },
                   { name: "豆包", url: "https://www.doubao.com/chat/" }, // 直达对话
                   { name: "智谱清言", url: "https://chatglm.cn/main/alltoolsdetail" },
                   { name: "腾讯混元", url: "https://hunyuan.tencent.com/chat" }, // 直达对话
                   { name: "讯飞星火", url: "https://xinghuo.xfyun.cn/desk" }
               ];

        function summonAI() {
            if (isLoading) return;
            isLoading = true;

            document.getElementById('loading').style.display = 'flex';

            if (window.plus) {
                try { plus.device.vibrate(100); } catch(e) {}
            }

            // 假装匹配
            setTimeout(function() {
                var randomIndex = Math.floor(Math.random() * aiSites.length);
                var target = aiSites[randomIndex];

                // 强制跳转
                if (window.plus) {
                    plus.runtime.openURL(target.url);
                } else {
                    window.open(target.url, '_blank');
                }

                setTimeout(function() {
                    document.getElementById('loading').style.display = 'none';
                    isLoading = false;
                }, 1000);

            }, 800);
        }
    </script>
</body>
</html>
