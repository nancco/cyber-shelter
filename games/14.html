<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>时间刻度</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .back-btn {
            position: fixed; top: 15px; left: 15px; z-index: 9999;
            color: #fff; background: rgba(50, 50, 50, 0.8);
            padding: 8px 15px; border-radius: 20px; text-decoration: none; font-size: 14px;
            font-family: sans-serif;
        }

        /* 模式切换器 */
        .mode-switch { display: flex; gap: 20px; margin-bottom: 40px; }
        .mode-btn {
            background: none; border: none; color: #555; font-size: 16px;
            font-weight: bold; font-family: sans-serif; padding: 5px 10px; transition: color 0.3s;
        }
        .mode-btn.active { color: #ffffff; border-bottom: 2px solid #ffffff; }

        /* 时间显示区 */
        .timer-container { display: flex; flex-direction: column; align-items: center; margin-bottom: 40px; }
        .days { font-size: 72px; font-weight: bold; letter-spacing: 2px; }
        .days span { font-size: 20px; color: #888; margin-left: 10px; font-weight: normal;}
        .hms { font-size: 22px; color: #aaa; margin-top: 10px; letter-spacing: 3px; }
        .target-date { font-size: 12px; color: #444; margin-top: 20px; }

        /* 纯文本设置区 */
        .setup-area { display: flex; flex-direction: column; align-items: center; gap: 15px; }
        
        .input-row { display: flex; gap: 5px; align-items: center; color: #888; font-size: 14px; }
        
        .text-input {
            background-color: #1e1e1e;
            color: #fff;
            border: 1px solid #333;
            padding: 10px;
            border-radius: 8px;
            font-size: 18px;
            font-family: monospace;
            text-align: center;
            outline: none;
            width: 50px;
        }
        .year-input { width: 80px; }
        
        .confirm-btn {
            background-color: #333; color: #fff; border: none;
            padding: 12px 40px; border-radius: 10px; font-size: 16px;
            margin-top: 10px;
        }
        .confirm-btn:active { background-color: #555; }
        
        #errorText { color: #ff4757; font-size: 12px; font-family: sans-serif; height: 16px;}
    </style>
</head>
<body>
    <a href="../index.html" class="back-btn">← 返回</a>

    <div class="mode-switch">
        <button class="mode-btn active" id="btn-down" onclick="setMode('down')">倒计时</button>
        <button class="mode-btn" id="btn-up" onclick="setMode('up')">正计时</button>
    </div>

    <div class="timer-container">
        <div class="days">
            <span id="dayCount">0</span><span>天</span>
        </div>
        <div class="hms" id="hmsCount">00:00:00</div>
        <div class="target-date" id="targetText">请设置目标时间</div>
    </div>

    <!-- 纯文本输入区 -->
    <div class="setup-area">
        <div class="input-row">
            <input type="number" class="text-input year-input" id="inYear" value="2025"> 年
            <input type="number" class="text-input" id="inMonth" value="1"> 月
            <input type="number" class="text-input" id="inDay" value="1"> 日
        </div>
        <div class="input-row">
            <input type="number" class="text-input" id="inHour" value="0"> 时
            <input type="number" class="text-input" id="inMin" value="0"> 分
        </div>
        <button class="confirm-btn" onclick="startTimer()">锁定目标</button>
        <div id="errorText"></div>
    </div>

    <script>
        // 捕获任何全局错误，绝不白屏
        window.onerror = function(msg) {
            document.getElementById('errorText').innerText = "系统拦截错误: " + msg;
            return false;
        };

        var mode = 'down';
        var targetTime = null;
        var timerInterval = null;

        var dayEl = document.getElementById('dayCount');
        var hmsEl = document.getElementById('hmsCount');
        var targetText = document.getElementById('targetText');

        function setMode(newMode) {
            mode = newMode;
            document.getElementById('btn-down').className = "mode-btn";
            document.getElementById('btn-up').className = "mode-btn";
            document.getElementById('btn-' + newMode).className = "mode-btn active";
            
            if (targetTime) startTimer();
        }

        function startTimer() {
            try {
                var y = parseInt(document.getElementById('inYear').value) || 2025;
                var m = parseInt(document.getElementById('inMonth').value) || 1;
                var d = parseInt(document.getElementById('inDay').value) || 1;
                var h = parseInt(document.getElementById('inHour').value) || 0;
                var min = parseInt(document.getElementById('inMin').value) || 0;

                // 手动拼接日期，避开各种解析坑
                var dateStr = y + "-" + (m<10?'0'+m:m) + "-" + (d<10?'0'+d:d) + "T" + (h<10?'0'+h:h) + ":" + (min<10?'0'+min:min) + ":00";
                targetTime = new Date(dateStr).getTime();

                if (isNaN(targetTime)) {
                    document.getElementById('errorText').innerText = "时间格式错误！";
                    return;
                }

                document.getElementById('errorText').innerText = "";
                targetText.innerText = "目标：" + y + "年" + m + "月" + d + "日 " + h + ":" + min;

                if (timerInterval) clearInterval(timerInterval);
                updateTime();
                timerInterval = setInterval(updateTime, 1000);
            } catch (e) {
                document.getElementById('errorText').innerText = "计算出错！";
            }
        }

        function updateTime() {
            if (!targetTime) return;
            var now = new Date().getTime();
            var diff = 0;

            if (mode === 'down') {
                diff = targetTime - now;
                if (diff <= 0) {
                    clearInterval(timerInterval);
                    dayEl.innerText = "0";
                    hmsEl.innerText = "00:00:00";
                    targetText.innerText = "时间已到";
                    return;
                }
            } else {
                diff = now - targetTime;
                if (diff < 0) {
                    dayEl.innerText = "0";
                    hmsEl.innerText = "00:00:00";
                    targetText.innerText = "目标时间还未到达";
                    return;
                }
            }

            var days = Math.floor(diff / (1000 * 60 * 60 * 24));
            var hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            var minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            var seconds = Math.floor((diff % (1000 * 60)) / 1000);

            dayEl.innerText = days;
            
            var hStr = hours < 10 ? '0' + hours : hours;
            var mStr = minutes < 10 ? '0' + minutes : minutes;
            var sStr = seconds < 10 ? '0' + seconds : seconds;
            
            hmsEl.innerText = hStr + ":" + mStr + ":" + sStr;
        }

        // 初始化填入明天的时间
        function init() {
            var tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            
            document.getElementById('inYear').value = tomorrow.getFullYear();
            document.getElementById('inMonth').value = tomorrow.getMonth() + 1;
            document.getElementById('inDay').value = tomorrow.getDate();
            document.getElementById('inHour').value = 0;
            document.getElementById('inMin').value = 0;
        }

        init();
    </script>
</body>
</html>
