<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>番茄专注</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .back-btn {
            position: fixed; top: 15px; left: 15px; z-index: 9999;
            color: #fff; background: rgba(50, 50, 50, 0.8);
            padding: 8px 15px; border-radius: 20px; text-decoration: none; font-size: 14px;
            font-family: sans-serif;
        }

        /* ===== 新增：时间设置区 ===== */
        .setup-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
            transition: opacity 0.3s;
        }
        .setup-area.disabled {
            opacity: 0.3;
            pointer-events: none; /* 运行中禁止点击 */
        }
        
        .input-group {
            display: flex;
            align-items: center;
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 5px 15px;
            margin-bottom: 15px;
        }
        .input-group input {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            font-family: monospace;
            width: 60px;
            text-align: center;
            outline: none;
        }
        /* 去掉数字输入框自带的上下小箭头 */
        .input-group input::-webkit-outer-spin-button,
        .input-group input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .input-group span {
            color: #888;
            font-size: 16px;
            margin-left: 5px;
        }

        .quick-btns {
            display: flex;
            gap: 10px;
        }
        .quick-btns button {
            background-color: #1e1e1e;
            color: #aaa;
            border: 1px solid #333;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 12px;
        }
        .quick-btns button:active { background-color: #333; color: #fff;}

        /* ===== 核心时间显示 ===== */
        .timer {
            font-size: 76px;
            font-weight: bold;
            color: #ff4757;
            text-shadow: 0 0 30px rgba(255, 71, 87, 0.3);
            margin-bottom: 50px;
            letter-spacing: 2px;
            transition: color 0.3s;
        }
        .timer.running {
            color: #4caf50;
            text-shadow: 0 0 30px rgba(76, 175, 80, 0.3);
        }

        /* ===== 按钮组 ===== */
        .btn-group { display: flex; gap: 20px; }
        button.action-btn {
            background-color: #333;
            color: #fff;
            border: none;
            padding: 15px 35px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            font-family: sans-serif;
            transition: transform 0.1s;
        }
        button.action-btn:active { transform: scale(0.95); }
        .btn-start { background-color: #4caf50; box-shadow: 0 0 15px rgba(76, 175, 80, 0.2); }
        .btn-start:active { background-color: #388e3c; }
        .btn-stop { background-color: #1e1e1e; border: 1px solid #333; color: #888; }

        .status { margin-top: 40px; color: #555; font-size: 14px; font-family: sans-serif; letter-spacing: 1px; }

        /* 遮罩 */
        #rest-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(18, 18, 18, 0.95);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 99999; animation: fadeIn 0.5s;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        #rest-screen h1 { color: #4caf50; font-size: 36px; margin-bottom: 20px; font-family: sans-serif;}
        #rest-screen p { color: #aaa; font-size: 16px; margin-bottom: 40px; font-family: sans-serif;}
        .btn-rest-close {
            background-color: #333; color: #fff; padding: 15px 40px;
            border-radius: 30px; border: none; font-size: 16px; font-weight: bold;
        }
    </style>
</head>
<body>
    <a href="../index.html" class="back-btn">← 返回</a>
    
    <!-- 新增：时间设置 -->
    <div class="setup-area" id="setupArea">
        <div class="input-group">
            <input type="number" id="minInput" value="25" min="1" max="999" onchange="updateFromInput()">
            <span>分钟</span>
        </div>
        <div class="quick-btns">
            <button onclick="setQuick(15)">15分</button>
            <button onclick="setQuick(25)">25分</button>
            <button onclick="setQuick(45)">45分</button>
            <button onclick="setQuick(60)">60分</button>
        </div>
    </div>

    <div class="timer" id="timeDisplay">25:00</div>
    
    <div class="btn-group">
        <button class="action-btn btn-start" id="startBtn" onclick="toggleTimer()">开始专注</button>
        <button class="action-btn btn-stop" onclick="resetTimer()">重置</button>
    </div>
    
    <div class="status" id="statusText">拒绝内耗，专注当下</div>

    <div id="rest-screen">
        <h1>🍅 专注结束！</h1>
        <p>起来走动一下，喝口水，看看远方。</p>
        <button class="btn-rest-close" onclick="closeRest()">休息好了</button>
    </div>

    <script>
        var totalSeconds = 25 * 60; 
        var timerInterval = null;
        var isRunning = false;
        
        var display = document.getElementById('timeDisplay');
        var startBtn = document.getElementById('startBtn');
        var statusText = document.getElementById('statusText');
        var restScreen = document.getElementById('rest-screen');
        var setupArea = document.getElementById('setupArea');
        var minInput = document.getElementById('minInput');

        // 格式化时间 (60进制逻辑)
        function updateDisplay() {
            // 如果超过 60 分钟，小时和分钟分离显示？不用，直接显示 90:00，在超长专注里更直观
            var m = Math.floor(totalSeconds / 60);
            var s = totalSeconds % 60;
            var mStr = m < 10 ? '0' + m : m;
            var sStr = s < 10 ? '0' + s : s;
            display.innerText = mStr + ':' + sStr;
            
            if (isRunning) {
                document.title = mStr + ':' + sStr + ' - 专注中';
            } else {
                document.title = '番茄专注';
            }
        }

        // 输入框修改时间
        function updateFromInput() {
            if (isRunning) return; // 运行中禁止修改
            var val = parseInt(minInput.value);
            if (isNaN(val) || val <= 0) {
                val = 25;
                minInput.value = 25;
            }
            if (val > 999) val = 999; // 防止输入过大的数字
            totalSeconds = val * 60;
            updateDisplay();
        }

        // 快捷设置时间
        function setQuick(mins) {
            if (isRunning) return;
            minInput.value = mins;
            totalSeconds = mins * 60;
            updateDisplay();
        }

        function playDing() {
            if (!window.AudioContext && !window.webkitAudioContext) return;
            var AudioContext = window.AudioContext || window.webkitAudioContext;
            var ctx = new AudioContext();
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.type = 'sine'; 
            osc.frequency.setValueAtTime(1000, ctx.currentTime); 
            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.5);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 1.5);
        }

        function vibrate() {
            if (window.plus) plus.device.vibrate(1000);
            else if (navigator.vibrate) navigator.vibrate([500, 200, 500]);
        }

        function toggleTimer() {
            if (isRunning) {
                // 暂停
                clearInterval(timerInterval);
                isRunning = false;
                startBtn.innerText = "继续专注";
                startBtn.className = "action-btn btn-start";
                statusText.innerText = "已暂停，调整一下呼吸";
                display.className = "timer"; 
                setupArea.classList.remove('disabled'); // 暂停时允许修改（如果重开的话）
                document.title = '番茄专注';
            } else {
                // 如果输入框的值和当前秒数不一致，先同步
                updateFromInput();

                // 开始
                isRunning = true;
                startBtn.innerText = "暂停";
                startBtn.className = "action-btn btn-stop";
                statusText.innerText = "正在专注中，保持心流...";
                display.className = "timer running"; 
                setupArea.classList.add('disabled'); // 运行中隐藏/禁用设置区
                
                timerInterval = setInterval(function() {
                    totalSeconds--;
                    updateDisplay();
                    
                    if (totalSeconds <= 0) {
                        clearInterval(timerInterval);
                        isRunning = false;
                        totalSeconds = 0;
                        updateDisplay();
                        
                        restScreen.style.display = 'flex';
                        playDing();
                        vibrate();
                        
                        startBtn.innerText = "开始专注";
                        startBtn.className = "action-btn btn-start";
                        statusText.innerText = "刚刚完成了一个番茄钟！";
                        display.className = "timer";
                        document.title = '🍅 休息一下';
                        setupArea.classList.remove('disabled');
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            updateFromInput(); // 重置为输入框里的时间
            startBtn.innerText = "开始专注";
            startBtn.className = "action-btn btn-start";
            statusText.innerText = "拒绝内耗，专注当下";
            display.className = "timer";
            setupArea.classList.remove('disabled');
            document.title = '番茄专注';
        }

        function closeRest() {
            restScreen.style.display = 'none';
            resetTimer();
        }

        // 初始化
        updateDisplay();
    </script>
</body>
</html>
