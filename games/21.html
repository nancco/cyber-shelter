<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>表情包搜索</title>
    <style>
        body {
            background-color: #121212; color: #ffffff; font-family: sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .back-btn {
            position: fixed; top: 15px; left: 15px; z-index: 9999;
            color: #fff; background: rgba(50, 50, 50, 0.8);
            padding: 8px 15px; border-radius: 20px; text-decoration: none; font-size: 14px;
        }

        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 24px; color: #ffd700; margin-bottom: 10px; letter-spacing: 2px;}
        .header p { font-size: 14px; color: #888; }

        .search-container {
            width: 100%; max-width: 340px;
            display: flex; flex-direction: column;
        }

        .input-box {
            display: flex;
            align-items: center;
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 50px;
            padding: 5px 15px;
            transition: border-color 0.2s;
        }
        .input-box:focus-within { border-color: #555; }

        .input-box input {
            flex: 1;
            background: none;
            border: none;
            color: #fff;
            padding: 12px 5px;
            font-size: 16px;
            outline: none;
        }
        .input-box input::placeholder { color: #666; }

        .search-icon-btn {
            background: none;
            border: none;
            font-size: 20px;
            padding: 5px;
            cursor: pointer;
            outline: none;
            transition: transform 0.1s;
        }
        .search-icon-btn:active { transform: scale(0.8); }

        .tag-title { font-size: 13px; color: #666; margin-top: 25px; margin-bottom: 10px; text-align: center;}
        .tag-group { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        
        .tag-btn {
            background-color: #1e1e1e; color: #aaa; border: 1px solid #333;
            padding: 8px 16px; border-radius: 20px; font-size: 13px;
            cursor: pointer; outline: none; font-family: sans-serif;
        }
        .tag-btn:active { background-color: #333; color: #fff; }

    </style>
</head>
<body>
    <a href="../index.html" class="back-btn">← 返回</a>

    <div class="header">
        <h1>表情包搜索</h1>
        <p>爱搜不搜，有本事来斗图</p>
    </div>
                  <div class="input-box">
                      <input type="text" id="keywordInput" placeholder="输入想搜的梗..." maxlength="20" onkeydown="handleEnter(event)">
                      
                      <!-- 纯 SVG 高冷版放大镜 -->
                      <button class="search-icon-btn" onclick="doSearch()">
                          <svg viewBox="0 0 24 24" style="width: 20px; height: 20px; fill: #fff; margin-top: 4px;">
                              <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                          </svg>
                      </button>
                  </div>

        <div class="tag-title">🔥 热门搜索</div>
        <div class="tag-group">
            <button class="tag-btn" onclick="fillInput('猫猫')">猫猫</button>
            <button class="tag-btn" onclick="fillInput('熊猫头')">熊猫头</button>
            <button class="tag-btn" onclick="fillInput('无语')">无语</button>
            <button class="tag-btn" onclick="fillInput('摸鱼')">摸鱼</button>
            <button class="tag-btn" onclick="fillInput('老板')">老板</button>
            <button class="tag-btn" onclick="fillInput('大肥鱼')">大肥鱼</button>
            <button class="tag-btn" onclick="fillInput('鲸鱼娘')">鲸鱼娘</button>
			<button class="tag-btn" onclick="fillInput('月薪喵')">月薪喵</button>
        </div>
    </div>
    <script>
        window.onerror = function(msg) {
            alert("发生错误: " + msg);
            return false;
        };

        function fillInput(keyword) {
            var input = document.getElementById('keywordInput');
            input.value = keyword;
            if (window.plus) {
                try { plus.device.vibrate(20); } catch(e) {}
            }
        }

        function handleEnter(e) {
            if (e.keyCode === 13 || e.key === 'Enter') {
                doSearch();
            }
        }

        function doSearch() {
            var keyword = document.getElementById('keywordInput').value.trim();
            if (!keyword) {
                alert("字都不打，搜个寂寞啊？！");
                return;
            }

            var encodedKeyword = encodeURIComponent(keyword + " 表情包");
            
            // 使用百度最经典、最长寿的图片搜索接口。
            // 这个接口虽然看起来是PC端的，但在手机上会自动转化为响应式流，且极少被拦截！
            var url = "https://image.baidu.com/search/index?tn=baiduimage&word=" + encodedKeyword;

            if (window.plus) {
                try { plus.device.vibrate(30); } catch(e) {}
                try { plus.runtime.openURL(url); } catch(e) { alert("跳转失败"); }
            } else {
                window.open(url, '_blank');
            }
        }
    </script>
</body>
</html>
